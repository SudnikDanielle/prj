<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genshin Randomizer</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0e17;
  --bg2: #1a1828;
  --bg3: #231f35;
  --card: #1e1b2e;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #f0ecff;
  --text2: #9b96b8;
  --text3: #5e5a7a;
  --accent: #c8a96e;
  --accent2: #e8c98a;
  --gold: #f0c060;
  --purple4: #9b7fd4;
  --glow: rgba(200,169,110,0.15);

  --pyro-bg:#3d1a10; --pyro-c:#ff8c5a; --pyro-badge:#ff6a35;
  --hydro-bg:#0d2540; --hydro-c:#5ab4ff; --hydro-badge:#3d9fe0;
  --anemo-bg:#0d2d25; --anemo-c:#4dffd4; --anemo-badge:#2ad4a8;
  --electro-bg:#20143d; --electro-c:#c084fc; --electro-badge:#a855f7;
  --dendro-bg:#142d0d; --dendro-c:#86efac; --dendro-badge:#4ade80;
  --cryo-bg:#0d2035; --cryo-c:#93c5fd; --cryo-badge:#60a5fa;
  --geo-bg:#2d1f0d; --geo-c:#fcd34d; --geo-badge:#f59e0b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* stars bg */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 50% 70%, rgba(200,169,110,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 10% 90%, rgba(255,255,255,0.2) 0%, transparent 100%),
    radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.25) 0%, transparent 100%),
    radial-gradient(1px 1px at 40% 15%, rgba(255,255,255,0.35) 0%, transparent 100%),
    radial-gradient(1px 1px at 70% 85%, rgba(200,169,110,0.2) 0%, transparent 100%),
    radial-gradient(1px 1px at 30% 55%, rgba(255,255,255,0.2) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

.wrap { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 2rem 1rem 4rem; }

/* Header */
.header { text-align: center; margin-bottom: 2rem; }
.header h1 {
  font-family: 'Cinzel', serif;
  font-size: clamp(1.6rem, 5vw, 2.8rem);
  font-weight: 600;
  background: linear-gradient(135deg, var(--accent) 0%, var(--gold) 50%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.05em;
  text-shadow: none;
}
.header p { color: var(--text2); font-size: 0.85rem; margin-top: 0.3rem; letter-spacing: 0.05em; }

/* Tabs */
.tabs { display: flex; gap: 6px; margin-bottom: 1.5rem; background: var(--bg2); border-radius: 12px; padding: 5px; border: 1px solid var(--border); }
.tab { flex: 1; padding: 9px 8px; font-size: 13px; font-weight: 600; font-family: 'Nunito', sans-serif; border: none; border-radius: 8px; background: transparent; color: var(--text2); cursor: pointer; transition: all 0.2s; }
.tab.active { background: var(--bg3); color: var(--accent2); box-shadow: 0 0 12px var(--glow); }

/* Result card */
.result-area { margin-bottom: 1.5rem; }
.result-card {
  background: linear-gradient(135deg, var(--bg2) 0%, var(--bg3) 100%);
  border: 1px solid var(--border2);
  border-radius: 16px;
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.25rem;
  min-height: 100px;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
}
.result-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--res-glow, transparent);
  opacity: 0.06;
  transition: all 0.3s;
}
.res-icon {
  width: 64px; height: 64px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
  background: var(--res-icon-bg, var(--bg3));
  border: 1px solid var(--border);
  transition: all 0.3s;
}
.res-info { flex: 1; min-width: 0; }
.res-name { font-size: 1.35rem; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.res-name.placeholder { color: var(--text3); font-weight: 400; font-size: 1rem; }
.res-sub { font-size: 0.8rem; color: var(--text2); margin-bottom: 6px; }
.res-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { padding: 2px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; }

/* Result artwork */
.res-art { display: none; margin-top: 0.9rem; text-align: center; }
.res-art img {
  max-width: 100%;
  max-height: 360px;
  border-radius: 14px;
  border: 1px solid var(--border2);
  box-shadow: 0 10px 34px rgba(0,0,0,0.45), 0 0 26px var(--glow);
  animation: pop 0.3s ease;
}

/* Sound toggle */
.sound-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  font-family: 'Nunito', sans-serif;
  border: 1px solid var(--border2);
  border-radius: 99px;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}
.sound-btn:hover { color: var(--text); border-color: rgba(200,169,110,0.4); }
.sound-btn.on { color: var(--accent2); border-color: var(--accent); background: rgba(200,169,110,0.12); }
.sound-row { text-align: center; margin-bottom: 1.5rem; }

/* Roll button */
.roll-btn {
  width: 100%;
  padding: 14px;
  font-family: 'Cinzel', serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  border: 1px solid var(--accent);
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(200,169,110,0.12) 0%, rgba(240,192,96,0.08) 100%);
  color: var(--accent2);
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 0.5rem;
}
.roll-btn:hover { background: linear-gradient(135deg, rgba(200,169,110,0.22) 0%, rgba(240,192,96,0.16) 100%); box-shadow: 0 0 20px var(--glow); }
.roll-btn:active { transform: scale(0.98); }

.count-label { text-align: center; font-size: 11px; color: var(--text3); margin-bottom: 1.5rem; }

/* Filters */
.filter-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; }
.filter-group { margin-bottom: 10px; }
.filter-group:last-child { margin-bottom: 0; }
.filter-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--text3); text-transform: uppercase; margin-bottom: 6px; }
.filter-row { display: flex; flex-wrap: wrap; gap: 5px; }
.fbtn { padding: 4px 11px; font-size: 11px; font-weight: 600; font-family: 'Nunito', sans-serif; border: 1px solid var(--border2); border-radius: 99px; background: transparent; color: var(--text2); cursor: pointer; transition: all 0.15s; }
.fbtn.active { background: var(--bg3); color: var(--text); border-color: rgba(200,169,110,0.4); }
.fbtn.own-only { border-color: rgba(200,169,110,0.6); color: var(--accent); }
.fbtn.own-only.active { background: rgba(200,169,110,0.15); color: var(--accent2); border-color: var(--accent); }

/* Roster section */
.roster-section { margin-top: 1.5rem; }
.roster-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
.roster-title { font-family: 'Cinzel', serif; font-size: 0.85rem; color: var(--accent); letter-spacing: 0.05em; }
.roster-actions { display: flex; gap: 6px; }
.roster-btn { padding: 4px 12px; font-size: 11px; font-family: 'Nunito', sans-serif; font-weight: 600; border: 1px solid var(--border2); border-radius: 6px; background: transparent; color: var(--text2); cursor: pointer; transition: all 0.15s; }
.roster-btn:hover { color: var(--text); border-color: var(--border2); background: var(--bg3); }

/* Roster filters */
.roster-filters { display: flex; flex-direction: column; gap: 6px; margin-bottom: 0.85rem; }

/* Character grid */
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; }
.char-card {
  padding: 8px 6px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg3);
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
  position: relative;
  user-select: none;
}
.char-card:hover { border-color: var(--border2); }
.char-card.owned {
  border-color: rgba(200,169,110,0.5);
  background: rgba(200,169,110,0.07);
}
.char-card.owned::after {
  content: '✓';
  position: absolute;
  top: 3px; right: 5px;
  font-size: 10px;
  color: var(--accent);
  font-weight: 700;
}
.char-el { font-size: 16px; margin-bottom: 2px; }
.char-name { font-size: 10px; font-weight: 600; color: var(--text2); line-height: 1.2; }
.char-card.owned .char-name { color: var(--text); }
.char-s5 .char-name { color: var(--gold); }
.char-card.owned.char-s5 .char-name { color: var(--gold); }

/* Element colors for tags */
.el-pyro    { background: var(--pyro-bg);    color: var(--pyro-c); }
.el-hydro   { background: var(--hydro-bg);   color: var(--hydro-c); }
.el-anemo   { background: var(--anemo-bg);   color: var(--anemo-c); }
.el-electro { background: var(--electro-bg); color: var(--electro-c); }
.el-dendro  { background: var(--dendro-bg);  color: var(--dendro-c); }
.el-cryo    { background: var(--cryo-bg);    color: var(--cryo-c); }
.el-geo     { background: var(--geo-bg);     color: var(--geo-c); }

.reg-tag { background: rgba(255,255,255,0.06); color: var(--text2); }
.type-tag { background: rgba(255,255,255,0.04); color: var(--text3); }
.s5-tag { background: rgba(240,192,96,0.12); color: var(--gold); }
.s4-tag { background: rgba(155,127,212,0.15); color: var(--purple4); }

/* Divider */
.divider { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }

/* Anim */
@keyframes pop { 0%{transform:scale(0.9);opacity:0} 100%{transform:scale(1);opacity:1} }
.result-card.popped { animation: pop 0.25s ease; }

@media (max-width: 480px) {
  .char-grid { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
}
</style>
</head>

<div class="wrap">

<div class="header">
  <h1>✦ Genshin Randomizer ✦</h1>
  <p>Патч 6.7 · 120+ персонажей · 44 мировых босса · 13 еженедельных · 47 местных легенд</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('chars')">Персонажи</button>
  <button class="tab" onclick="switchTab('world')">Мировые боссы</button>
  <button class="tab" onclick="switchTab('weekly')">Еженедельные</button>
  <button class="tab" onclick="switchTab('legend')">Легенды</button>
</div>

<!-- Result -->
<div class="result-area">

  </div>
  <div class="res-art" id="res-art"><img id="res-img" alt=""></div>
</div>

<button class="roll-btn" onclick="roll()">⚂ Случайный выбор</button>
<div class="sound-row">
  <button class="sound-btn" id="sound-btn" onclick="toggleSound()">🔇 Звук выкл.</button>
</div>
<div class="count-label" id="count-lbl"></div>

<!-- Chars filters -->
<div id="chars-section">
  <div class="filter-section">
    <div class="filter-group">
      <div class="filter-label">Из ростера</div>
      <div class="filter-row">
        <button class="fbtn own-only" id="own-only-btn" onclick="toggleOwnOnly()">Только мои персонажи</button>
      </div>
    </div>
    <div class="filter-group">
      <div class="filter-label">Элемент</div>
      <div class="filter-row" id="el-filter"></div>
    </div>
    <div class="filter-group">
      <div class="filter-label">Регион</div>
      <div class="filter-row" id="reg-filter"></div>
    </div>
    <div class="filter-group">
      <div class="filter-label">Редкость</div>
      <div class="filter-row">
        <button class="fbtn active" onclick="toggleF(cRarity,'5',this)">★★★★★</button>
        <button class="fbtn active" onclick="toggleF(cRarity,'4',this)">★★★★</button>
      </div>
    </div>
  </div>

  <!-- Roster -->
  <div class="roster-section">
    <div class="roster-header">
      <span class="roster-title">МОЙ РОСТЕР</span>
      <div class="roster-actions">
        <span id="owned-count" style="font-size:11px;color:var(--text3);align-self:center;margin-right:4px"></span>
        <button class="roster-btn" onclick="selectAll()">Все</button>
        <button class="roster-btn" onclick="clearAll()">Сбросить</button>
      </div>
    </div>
    <div class="roster-filters">
      <div class="filter-row" id="grid-el-filter"></div>
      <div class="filter-row" id="grid-reg-filter"></div>
    </div>
    <div class="char-grid" id="char-grid"></div>
  </div>
</div>

<!-- World boss filters -->
<div id="world-section" style="display:none">
  <div class="filter-section">
    <div class="filter-group">
      <div class="filter-label">Регион</div>
      <div class="filter-row" id="wr-filter"></div>
    </div>
    <div class="filter-group">
      <div class="filter-label">Тип</div>
      <div class="filter-row">
        <button class="fbtn active" onclick="toggleF(wTypes,'hypostasis',this)">Гипостазисы</button>
        <button class="fbtn active" onclick="toggleF(wTypes,'flower',this)">Цветы / Лозы</button>
        <button class="fbtn active" onclick="toggleF(wTypes,'dragon',this)">Драконы</button>
        <button class="fbtn active" onclick="toggleF(wTypes,'mech',this)">Механические</button>
        <button class="fbtn active" onclick="toggleF(wTypes,'other',this)">Прочие</button>
      </div>
    </div>
  </div>
</div>

<!-- Weekly boss filters -->
<div id="weekly-section" style="display:none">
  <div class="filter-section">
    <div class="filter-group">
      <div class="filter-label">Регион</div>
      <div class="filter-row" id="wkr-filter"></div>
    </div>
  </div>
</div>

<!-- Local legend filters -->
<div id="legend-section" style="display:none">
  <div class="filter-section">
    <div class="filter-group">
      <div class="filter-label">Регион</div>
      <div class="filter-row" id="lgr-filter"></div>
    </div>
  </div>
</div>

</div><!-- /wrap -->

const WORLD_REGIONS = ['Мондштадт','Ли Юэ','Инадзума','Сумеру','Фонтейн','Натлан','Нод-Край','Луна'];
const WEEKLY_REGIONS = ['Мондштадт','Ли Юэ','Инадзума','Сумеру','Фонтейн','Натлан','Нод-Край'];
const LEGEND_REGIONS = ['Фонтейн','Натлан','Нод-Край'];

let tab = 'chars';
let cEl    = new Set(EL.map(e=>e.id));
let cReg   = new Set(CHAR_REGIONS);
let cRarity= new Set(['5','4']);
let wReg   = new Set(WORLD_REGIONS);
let wTypes = new Set(['hypostasis','flower','dragon','mech','other']);
let wkReg  = new Set(WEEKLY_REGIONS);
let lgReg  = new Set(LEGEND_REGIONS);
let ownOnly= false;
// Фильтры сетки ростера (независимы от фильтров рулетки)
let gEl  = new Set(EL.map(e=>e.id));
let gReg = new Set(CHAR_REGIONS);

// Roster: load from localStorage
let owned = new Set(JSON.parse(localStorage.getItem('genshin_owned') || '[]'));
function saveOwned() { localStorage.setItem('genshin_owned', JSON.stringify([...owned])); }

// ====== BUILD FILTERS ======
function buildFilters() {
  document.getElementById('el-filter').innerHTML =
    EL.map(e=>`<button class="fbtn active" onclick="toggleF(cEl,'${e.id}',this)">${e.e} ${e.n}</button>`).join('');
  document.getElementById('reg-filter').innerHTML =
    CHAR_REGIONS.map(r=>`<button class="fbtn active" onclick="toggleF(cReg,'${r}',this)">${r}</button>`).join('');
  document.getElementById('wr-filter').innerHTML =
    WORLD_REGIONS.map(r=>`<button class="fbtn active" onclick="toggleF(wReg,'${r}',this)">${r}</button>`).join('');
  document.getElementById('wkr-filter').innerHTML =
    WEEKLY_REGIONS.map(r=>`<button class="fbtn active" onclick="toggleF(wkReg,'${r}',this)">${r}</button>`).join('');
  document.getElementById('lgr-filter').innerHTML =
    LEGEND_REGIONS.map(r=>`<button class="fbtn active" onclick="toggleF(lgReg,'${r}',this)">${r}</button>`).join('');
  document.getElementById('grid-el-filter').innerHTML =
    EL.map(e=>`<button class="fbtn active" title="${e.n}" onclick="toggleGridF(gEl,'${e.id}',this)">${e.e} ${e.n}</button>`).join('');
  document.getElementById('grid-reg-filter').innerHTML =
    CHAR_REGIONS.map(r=>`<button class="fbtn active" onclick="toggleGridF(gReg,'${r}',this)">${r}</button>`).join('');
}

// Переключение фильтра сетки: пустая группа = показывать все
function toggleGridF(set, key, btn) {
  if (set.has(key)) { set.delete(key); btn.classList.remove('active'); }
  else { set.add(key); btn.classList.add('active'); }
  buildGrid();
}

// ====== BUILD CHAR GRID ======
function buildGrid() {
  const grid = document.getElementById('char-grid');
  const list = CHARS.filter(c =>
    (gEl.size===0  || gEl.has(c.el)) &&
    (gReg.size===0 || gReg.has(c.r))
  );
  grid.innerHTML = list.map(c => {
    const el = EL.find(e=>e.id===c.el);
    const isOwned = owned.has(c.n);
    return `<div class="char-card ${isOwned?'owned':''} ${c.s===5?'char-s5':''}" onclick="toggleOwned('${c.n}',this)" title="${c.n}">
      <div class="char-el">${el.e}</div>
      <div class="char-name">${c.n}</div>
    </div>`;
  }).join('') || `<div style="color:var(--text3);font-size:12px;padding:8px">Нет персонажей по выбранным фильтрам</div>`;
  updateOwnedCount();
}

function toggleOwned(name, el) {
  if (owned.has(name)) { owned.delete(name); el.classList.remove('owned'); }
  else { owned.add(name); el.classList.add('owned'); }
  saveOwned();
  updateOwnedCount();
  updateCount();
}

function updateOwnedCount() {
  document.getElementById('owned-count').textContent = `${owned.size} из ${CHARS.length}`;
}

function selectAll() {
  CHARS.forEach(c => owned.add(c.n));
  saveOwned();
  buildGrid();
  updateCount();
}

function clearAll() {
  owned.clear();
  saveOwned();
  buildGrid();
  updateCount();
}

function toggleOwnOnly() {
  ownOnly = !ownOnly;
  const btn = document.getElementById('own-only-btn');
  btn.classList.toggle('active', ownOnly);
  updateCount();
}

// ====== FILTERS ======
function toggleF(set, key, btn) {
  if (set.has(key)) { if(set.size > 1){ set.delete(key); btn.classList.remove('active'); } }
  else { set.add(key); btn.classList.add('active'); }
  updateCount();
}

function filtered() {
  if (tab === 'chars') {
    let pool = CHARS.filter(c => cEl.has(c.el) && cReg.has(c.r) && cRarity.has(String(c.s)));
    if (ownOnly) pool = pool.filter(c => owned.has(c.n));
    return pool;
  }
  if (tab === 'world') return WORLD_BOSSES.filter(b => wReg.has(b.r) && wTypes.has(b.t));
  if (tab === 'weekly') return WEEKLY_BOSSES.filter(b => wkReg.has(b.r));
  return LEGENDS.filter(b => lgReg.has(b.r));
}

function updateCount() {
  const n = filtered().length;
  const total = tab==='chars' ? CHARS.length : tab==='world' ? WORLD_BOSSES.length : tab==='weekly' ? WEEKLY_BOSSES.length : LEGENDS.length;
  document.getElementById('count-lbl').textContent = `Подходит: ${n} из ${total}`;
}

// ====== MEDIA (картинки + звук) ======
// Картинки кладите в папку images/, звуки — в sounds/.
// Имя файла = имя персонажа/босса (напр. "Эмбер.png", "Эмбер.mp3").
const IMG_EXT = ['png','jpg','jpeg','webp','gif'];
const SND_EXT = ['mp3','ogg','wav','m4a'];
let soundOn = localStorage.getItem('genshin_sound') === '1';

// Превращает имя в безопасное имя файла (убирает / : « » и т.п.)
function mediaSlug(name) {
  return name.replace(/[\/\\:«»?*<>|"]/g, '').replace(/\s+/g, ' ').trim();
}

function showResultImage(name) {
  const box = document.getElementById('res-art');
  const img = document.getElementById('res-img');
  const s = mediaSlug(name);
  let i = 0;
  img.onload = () => { box.style.display = 'block'; };
  img.onerror = () => {
    i++;
    if (i < IMG_EXT.length) img.src = `images/${encodeURIComponent(s)}.${IMG_EXT[i]}`;
    else { box.style.display = 'none'; img.removeAttribute('src'); }
  };
  box.style.display = 'none';
  img.src = `images/${encodeURIComponent(s)}.${IMG_EXT[0]}`;
}

function hideResultImage() {
  const box = document.getElementById('res-art');
  const img = document.getElementById('res-img');
  box.style.display = 'none';
  img.onerror = null; img.onload = null; img.removeAttribute('src');
}

function playResultSound(name) {
  if (!soundOn) return;
  const s = mediaSlug(name);
  let i = 0;
  const audio = new Audio();
  audio.onerror = () => {
    i++;
    if (i < SND_EXT.length) { audio.src = `sounds/${encodeURIComponent(s)}.${SND_EXT[i]}`; audio.load(); }
  };
  audio.src = `sounds/${encodeURIComponent(s)}.${SND_EXT[0]}`;
  audio.play().catch(() => {});
}

function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('genshin_sound', soundOn ? '1' : '0');
  updateSoundBtn();
}

function updateSoundBtn() {
  const btn = document.getElementById('sound-btn');
  btn.classList.toggle('on', soundOn);
  btn.textContent = soundOn ? '🔊 Звук вкл.' : '🔇 Звук выкл.';
}

// ====== ROLL ======
function roll() {
  const pool = filtered();
  const card = document.getElementById('res-card');
  card.classList.remove('popped');
  void card.offsetWidth;
  card.classList.add('popped');

  if (!pool.length) {
    document.getElementById('res-name').textContent = 'Нет совпадений';
    document.getElementById('res-name').className = 'res-name placeholder';
    document.getElementById('res-sub').textContent = 'Измените фильтры или добавьте персонажей в ростер';
    document.getElementById('res-icon').textContent = '🤷';
    document.getElementById('res-icon').style.background = '';
    document.getElementById('res-tags').innerHTML = '';
    card.style.setProperty('--res-glow','transparent');
    hideResultImage();
    return;
  }

  const item = pool[Math.floor(Math.random() * pool.length)];
  const nameEl = document.getElementById('res-name');
  nameEl.textContent = item.n;
  nameEl.className = 'res-name';
  hideResultImage();

  if (tab === 'chars') {
    showResultImage(item.n);
    playResultSound(item.n);

    const el = EL.find(e=>e.id===item.el);
    document.getElementById('res-icon').textContent = el.e;
    document.getElementById('res-icon').style.background = EL_BG[item.el];
    card.style.setProperty('--res-glow', EL_BG[item.el]);
    document.getElementById('res-sub').textContent = item.r;
    document.getElementById('res-tags').innerHTML =
      `<span class="tag el-${item.el}">${el.e} ${el.n}</span>` +
      `<span class="tag ${item.s===5?'s5-tag':'s4-tag'}">${item.s===5?'★★★★★':'★★★★'}</span>` +
      (owned.has(item.n) ? `<span class="tag" style="background:rgba(200,169,110,0.15);color:#c8a96e">✓ в ростере</span>` : '');
  } else if (tab === 'world') {
    const rc = REG_BG[item.r] || '#1a1a1a';
    document.getElementById('res-icon').textContent = item.e;
    document.getElementById('res-icon').style.background = rc;
    card.style.setProperty('--res-glow', rc);
    const tn = {hypostasis:'Гипостазис',flower:'Цветок / Лоза',dragon:'Дракон / Ящер',mech:'Механический',other:'Прочее'};
    document.getElementById('res-sub').textContent = tn[item.t];
    document.getElementById('res-tags').innerHTML =
      `<span class="tag reg-tag">${item.r}</span>` +
      `<span class="tag type-tag">${tn[item.t]}</span>`;
  } else if (tab === 'weekly') {
    const rc = REG_BG[item.r] || '#1a1a1a';
    document.getElementById('res-icon').textContent = item.e;
    document.getElementById('res-icon').style.background = rc;
    card.style.setProperty('--res-glow', rc);
    document.getElementById('res-sub').textContent = item.d;
    document.getElementById('res-tags').innerHTML =
      `<span class="tag reg-tag">${item.r}</span>`;
  } else {
    const rc = REG_BG[item.r] || '#1a1a1a';
    document.getElementById('res-icon').textContent = item.e;
    document.getElementById('res-icon').style.background = rc;
    card.style.setProperty('--res-glow', rc);
    document.getElementById('res-sub').textContent = 'Местная легенда';
    document.getElementById('res-tags').innerHTML =
      `<span class="tag reg-tag">${item.r}</span>` +
      `<span class="tag type-tag">Местная легенда</span>`;
  }
}

// ====== TAB SWITCH ======
function switchTab(t) {
  tab = t;
  ['chars','world','weekly','legend'].forEach((id,i) => {
    document.querySelectorAll('.tab')[i].classList.toggle('active', id===t);
    document.getElementById(id+'-section').style.display = id===t?'':'none';
  });
  // Картинка и звук — только в разделе «Персонажи»
  document.querySelector('.sound-row').style.display = t==='chars' ? '' : 'none';
  // reset result
  document.getElementById('res-name').textContent = 'Нажмите кнопку ниже';
  document.getElementById('res-name').className = 'res-name placeholder';
  document.getElementById('res-sub').textContent = 'и получите случайный результат';
  document.getElementById('res-icon').textContent = '✦';
  document.getElementById('res-icon').style.background = '';
  document.getElementById('res-tags').innerHTML = '';
  document.getElementById('res-card').style.setProperty('--res-glow','transparent');
  hideResultImage();
  updateCount();
}

// ====== INIT ======
buildFilters();
buildGrid();
updateSoundBtn();
updateCount();
</script>
